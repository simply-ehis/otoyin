[package]
name = "otoyin"
version = "0.1.0"
description = "Otoyin — AI Audio Studio"
authors = ["otoyin"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros", "net"] }
# axum = "0.8"  # Requires network access to download; add when available
# tower = "0.5"
# tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
hound = "3.5"
base64 = "0.22"
cpal = "0.15"
symphonia = { version = "0.6", features = ["all"] }
scopeguard = "1.2.0"
keyring = "4"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1", features = ["async"] }
objc = "0.2"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.0"
tauri-plugin-updater = "2"
# Observe-only global keyboard tap for the dictation chord (chord engine).
keytap = "0.4"
# Global shortcut registration (system-wide hotkey → dictation toggle).
tauri-plugin-global-shortcut = "2.0"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]
rust-backend = []
