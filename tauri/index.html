<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>otoyin</title>
    <script>
      (() => {
        try {
          let theme = 'system';
          // The store persists under 'otoyin-ui' (see app/src/stores/uiStore).
          // Reading only the legacy '21-labs-ui' key meant this pre-paint
          // script never saw the user's theme, so the app booted in light mode
          // regardless of what was chosen, then corrected itself on mount.
          const raw =
            localStorage.getItem('otoyin-ui') || localStorage.getItem('21-labs-ui');
          let parsed;
          if (raw) {
            parsed = JSON.parse(raw);
            if (parsed?.state?.theme) theme = parsed.state.theme;
          }
          // Keep this in step with app/index.html (and src/lib/themes.ts):
          // without the special-theme classes, non-default themes rendered
          // with default colours until the store mounted (a visible flash).
          const KNOWN = ['system', 'light', 'dark', 'stripe'];
          let resolved = KNOWN.includes(theme) ? theme : 'system';
          if (resolved === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved === 'light') {
            document.documentElement.classList.add('light');
          } else if (resolved === 'stripe') {
            document.documentElement.classList.add('dark', 'theme-stripe');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="initial-splash" aria-hidden="true">
      <style>
        #initial-splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #f5f5f6; }
        html.dark #initial-splash { background: #0d0d10; }
        #initial-splash .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        #initial-splash .splash-name { margin: 0; font: 600 15px/1.2 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #1a1a1e; }
        html.dark #initial-splash .splash-name { color: #e8e8ec; }
        #initial-splash .splash-bar { width: 120px; height: 2px; margin: 0; border-radius: 2px; overflow: hidden; background: rgba(0,0,0,.12); }
        html.dark #initial-splash .splash-bar { background: rgba(255,255,255,.14); }
        #initial-splash .splash-bar span { display: block; height: 100%; width: 40%; background: #e11d48; animation: splash-slide 1.1s ease-in-out infinite alternate; }
        @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #initial-splash .splash-bar span { animation: none; } }
      </style>
      <div class="splash-inner">
        <img src="/favicon.svg" alt="" width="56" height="56" />
        <p class="splash-name">Otoyin</p>
        <p class="splash-bar"><span></span></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
