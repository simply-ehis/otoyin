name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend build verification ───────────────────────────────────────
  frontend-build:
    name: "Frontend: Vite build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=@otoyin/app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/dist/
          retention-days: 7

  # ── Tauri release builds (on tag) ────────────────────────────────────
  # Builds the Python backend (backend/build_binary.py → otoyin-server onedir),
  # stages it into tauri/src-tauri/binaries/otoyin-server (registered as a
  # bundle.resources dir), then builds the shell so the installer ships with a
  # real backend — not an empty shell.
  tauri-build:
    name: "Tauri: ${{ matrix.platform }} build"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # v0.1.0 ships Windows only (owner decision 2026-11-13): Linux/macOS
          # need their own sidecar staging (Linux/Darwin llama.cpp builds, a
          # Linux ffmpeg static build, non-NSIS bundle targets) plus real
          # on-metal runtime testing before a shippable installer exists.
          # macos-13 never got a runner; macos-latest/ubuntu get past the
          # Python deps but bundle NSIS only - unreachable targets. Re-enable
          # as a proper cross-platform port, not as unchecked CI legs.
          # ── ARM64 legs (GitHub public-preview ARM runners — org opt-in) ──
          # - platform: windows-11-arm
          #   target: aarch64-pc-windows-msvc
          # - platform: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      # Sidecars the installer ships with the app. Staging is release-pinned
      # scripts; rerun when bumping the sidecar versions.
      - name: Stage ffmpeg
        run: bash scripts/stage-ffmpeg.sh

      - name: Stage llama.cpp bundle (GGUF planner, TTS CLI)
        run: bash scripts/stage-llama.sh

      - name: Stage Steam Audio SDK (HRTF spatial audio)
        run: bash scripts/stage-steam-audio.sh

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build --workspace=@otoyin/app

      # ── Python backend: venv + deps + frozen server binary ────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # No torch anywhere in the build: the backend is pure ONNX/GGML sidecars.
      # The previous CPU-torch preinstall was dead weight (~175-800 MB) that
      # only served an empty venv.
      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build backend server (otoyin-server)
        run: bash scripts/build-server.sh
        env:
          PYTHON: python

      # externalBin sidecar - bundle step fails without it
      - name: Build MCP shim and stage sidecar
        run: bash scripts/build-shim.sh
        env:
          PYTHON: python

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build Tauri app
        working-directory: tauri
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          # Required since bundle.createUpdaterArtifacts is true: signs every
          # installer and emits the .sig files the updater manifest needs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 30

  # ── Release (on tag) ─────────────────────────────────────────────────
  release:
    name: "Release: Create GitHub Release"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tauri-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: artifacts/

      # Keep per-leg folders (each uploaded as tauri-<target>) and flatten them
      # into artifacts/ with a <triple>- filename prefix. Upload-artifact keeps
      # the matched directory structure, so the files are nested - find -r, not
      # a top-level glob. Two macOS legs both produce "<product>.app.tar.gz";
      # the prefix keeps release assets unique and lets build_update_manifest.py
      # map each platform to its installer.
      - name: Prefix artifacts with target triple
        shell: bash
        run: |
          shopt -s nullglob
          for dir in artifacts/tauri-*; do
            triple="${dir#artifacts/tauri-}"
            find "$dir" -type f | while IFS= read -r f; do
              mv "$f" "artifacts/${triple}-$(basename "$f")"
            done
            rm -rf "$dir"
          done
          echo "Flattened artifacts:"
          ls -1 artifacts/

      - name: Build updater manifest (latest.json)
        run: python .github/scripts/build_update_manifest.py artifacts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
