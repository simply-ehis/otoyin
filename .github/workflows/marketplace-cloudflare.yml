name: Deploy marketplace to Cloudflare

on:
  push:
    branches: [main, master]
    paths:
      - "marketplace/**"
      - ".github/workflows/marketplace-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: marketplace-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy marketplace API container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker and container
        working-directory: marketplace
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-site:
    name: Build and deploy marketplace website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketplace/web/package-lock.json
      - name: Install and build static website
        working-directory: marketplace/web
        run: |
          if [ -z "$NEXT_PUBLIC_MARKETPLACE_API_URL" ] || [[ "$NEXT_PUBLIC_MARKETPLACE_API_URL" == *localhost* ]]; then
            echo "Set the repository variable NEXT_PUBLIC_MARKETPLACE_API_URL to the deployed Cloudflare API URL ending in /v1."
            exit 1
          fi
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_MARKETPLACE_API_URL: ${{ vars.NEXT_PUBLIC_MARKETPLACE_API_URL }}
          NEXT_PUBLIC_MARKETPLACE_URL: ${{ vars.NEXT_PUBLIC_MARKETPLACE_URL }}
      - name: Deploy to Cloudflare Pages
        working-directory: marketplace/web
        run: npx --yes wrangler@4 pages deploy out --project-name otoyin-marketplace --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
