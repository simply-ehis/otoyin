name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────
  frontend-lint:
    name: "Frontend: Biome lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace=@otoyin/app

  frontend-typecheck:
    name: "Frontend: TypeScript"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck --workspace=@otoyin/app

  frontend-test:
    name: "Frontend: Vitest"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test --workspace=@otoyin/app

  frontend-e2e:
    name: "Frontend: Playwright e2e (critical paths)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e --workspace=@otoyin/app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/test-results/

  frontend-test-floor:
    name: "Frontend: canonical component test floor (prompt 14)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-ui-test-floor.py

  wiring-check:
    name: "Wiring: stranded endpoints / orphaned pages (prompt 20)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Install from the lockfile (prompt 19): exact tested versions, not
      # re-resolved ranges. Regenerate with: uv pip compile requirements.txt
      # -o requirements.lock --universal --header (run in backend/).
      - run: pip install -r backend/requirements.lock
      - run: python scripts/check-wiring.py --strict

  i18n-parity:
    name: "i18n: locale key parity (advisory until backlog is clear)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Advisory while ja/zh-CN/zh-TW carry the 123-key backlog (see
    # docs/reports/2026-09-04-i18n-backlog.md). Flip off continue-on-error
    # and add --strict once translators close it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-i18n-parity.py

  security-audit:
    name: "Dependencies: vulnerability audit (prompt 16)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: pip install pip-audit
      # Audit the lockfile so every transitive pin is covered, not just the
      # declared ranges.
      - run: pip-audit -r backend/requirements.lock

  frontend-build:
    name: "Frontend: Vite build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=@otoyin/app

  # ── Backend ───────────────────────────────────────────────────────────
  backend-lint:
    name: "Backend: Ruff lint + format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend
      - run: ruff format --check backend

  backend-test:
    name: "Backend: Pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock pytest pytest-asyncio pytest-timeout
      - name: Run CI test suite
        run: |
          python -m pytest \
            backend/tests/test_tool_registry.py \
            backend/tests/test_tr_dispatch.py \
            backend/tests/test_stt_backends.py \
            backend/tests/test_stt_self_check.py \
            backend/tests/test_generation_subfunctions.py \
            backend/tests/test_items_4_5_6.py \
            backend/tests/test_items_7_8_9.py \
            backend/tests/test_verify_system.py \
            -q --tb=line --no-header --timeout=30

  backend-checks:
    name: "Backend: Static checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Async blocking check
        run: python -X utf8 -m backend.scripts.check_async_blocking backend/routes
      - name: Name map check
        run: python -X utf8 -m backend.scripts.check_name_map
      - name: Placeholders check
        run: python -X utf8 -m backend.scripts.check_placeholders
      - name: Assistant tools check
        run: python -X utf8 -m backend.scripts.check_assistant_tools

  encoding-check:
    name: "Encoding: no invalid UTF-8 or U+FFFD (mojibake gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Fails when any tracked text file holds raw cp1252 bytes (invalid
      # UTF-8) or U+FFFD replacement chars — the archive-restore corruption
      # signature. Binary files (NUL bytes) are exempt.
      - run: python scripts/check-encoding.py

  # ── Rust ──────────────────────────────────────────────────────────────
  rust-check:
    name: "Rust: Clippy + tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

